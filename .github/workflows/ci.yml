name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 选择最新 Xcode
        run: |
          CANDIDATE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用 $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: 运行测试
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^[[:space:]]*([^(]+) \(([0-9A-F-]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "使用模拟器: $DEST"
          xcodebuild test \
            -project BuildLight.xcodeproj \
            -scheme BuildLight \
            -destination "platform=iOS Simulator,name=$DEST" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/test.log | tail -60

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          retention-days: 7

  ipa:
    name: 无签名 IPA
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 选择最新 Xcode
        run: |
          CANDIDATE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用 $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: 编译真机包（未签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project BuildLight.xcodeproj \
            -scheme BuildLight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee /tmp/build.log | tail -40

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find .build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          rm -rf /tmp/ipa/Payload/*.app/_CodeSignature || true
          cd /tmp/ipa && zip -qry BuildLight-unsigned.ipa Payload
          ls -lh BuildLight-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BuildLight-unsigned-ipa
          path: /tmp/ipa/BuildLight-unsigned.ipa
          retention-days: 30

      - name: 编译失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
