name: BuildLight
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BuildLight:
    type: application
    platform: iOS
    sources:
      - path: BuildLight
      - path: Shared
    dependencies:
      - package: ZIPFoundation
      - target: BuildLightWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.buildlight
        PRODUCT_NAME: BuildLight
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "17"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_CFBundleDisplayName: BuildLight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "qnq esign altstore sidestore apple-magnifier"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  BuildLightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BuildLightWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.buildlight.widgets
        PRODUCT_NAME: BuildLightWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BuildLightWidgets/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "17"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  BuildLightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuildLightTests
        excludes:
          - Fixtures
      - path: BuildLightTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: BuildLight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.buildlight.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BuildLight:
    build:
      targets:
        BuildLight: all
        BuildLightWidgets: all
        BuildLightTests: [test]
    test:
      targets:
        - BuildLightTests
      gatherCoverageData: true
